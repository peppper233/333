name: Run Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: CheckOut Your Code
      
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: pip install pytest
      
    - name: Run teacher tests
      run: python -m pytest .